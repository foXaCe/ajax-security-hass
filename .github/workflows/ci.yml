name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install ruff bandit codespell

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run bandit security check
        run: bandit -r custom_components/ajax/ -c pyproject.toml

      - name: Run codespell
        run: codespell custom_components/ajax/

  typing:
    name: Typing (mypy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # We're at 0 errors under the project's mypy config (see pyproject.toml).
    # The job now blocks merges — flipping --strict for full Platinum
    # strict-typing is the next milestone (see quality_scale.yaml).
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # 3.14 matches the project's runtime: the test harness
          # (pytest-homeassistant-custom-component) and recent Home Assistant
          # releases require it, and mypy must parse HA's 3.14 source.
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        # mypy only needs itself + homeassistant for stubs — NOT the pytest
        # test harness. Pulling requirements_test.txt here used to fail the
        # job on a Python-version conflict before mypy ever ran. Pin mypy so
        # this mandatory gate stays reproducible; bump deliberately.
        run: pip install "mypy==2.1.0" homeassistant

      - name: Run mypy
        run: mypy custom_components/ajax/

  requirements:
    name: Requirements
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Guards the exact gap that let aiobotocore>=3.8.0 ship broken: the other
    # jobs install requirements with plain pip, WITHOUT Home Assistant core's
    # package_constraints.txt, so a manifest requirement that resolves in CI can
    # still be unresolvable at runtime. HA 2026.8 pins botocore==1.42.97, which
    # aiobotocore>=3.8.0 cannot satisfy, so setup failed with "Requirements for
    # ajax not found". This job re-resolves the manifest requirements under HA's
    # own constraints, against the latest HA INCLUDING pre-releases so a
    # forward-compat break surfaces before it reaches a release.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install latest Home Assistant (incl. pre-releases)
        run: pip install --pre --upgrade homeassistant

      - name: Resolve manifest requirements under HA core constraints
        run: |
          CONSTRAINTS=$(python -c "import os, homeassistant; print(os.path.join(os.path.dirname(homeassistant.__file__), 'package_constraints.txt'))")
          REQS=$(python -c "import json; print(' '.join(json.load(open('custom_components/ajax/manifest.json'))['requirements']))")
          echo "Home Assistant: $(python -c 'import homeassistant.const as c; print(c.__version__)')"
          echo "Constraints file: $CONSTRAINTS"
          echo "Manifest requirements: $REQS"
          # --dry-run resolves without installing; -c applies HA's pins so an
          # incompatible floor (e.g. aiobotocore>=3.8.0 vs botocore==1.42.97)
          # fails here instead of at a user's setup.
          pip install --dry-run -c "$CONSTRAINTS" $REQS

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # 3.14 matches the project's runtime: pytest-homeassistant-custom-component
          # and the pinned homeassistant in requirements_test.txt require it. The old
          # job pinned 3.12 and failed to install before a single test ran.
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        # No editable install: there is no [project]/setup.py to build, and the suite
        # imports custom_components.ajax directly from the repo root, so the test
        # requirements are all that's needed.
        run: pip install -r requirements_test.txt

      - name: Run tests with coverage
        # python -m pytest puts the repo root on sys.path so custom_components.ajax
        # imports without an editable install.
        run: python -m pytest tests/ --cov=custom_components/ajax --cov-report=term-missing
